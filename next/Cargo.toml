[workspace]
members = ["crates/core-types", "crates/core-kernel", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
core-types = { path = "crates/core-types" }
core-kernel = { path = "crates/core-kernel" }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
