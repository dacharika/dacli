name: release

# Publication is a maintainer action: manually select an existing release tag
# and its full commit SHA. This workflow never
# creates or pushes tags and does not accept arbitrary commit publication.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.2.3)
        required: true
        type: string
      expected_commit:
        description: Full 40-character commit SHA currently named by the tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      tag_object: ${{ steps.validate.outputs.tag_object }}
    steps:
      # workflow_dispatch can target other refs. Bind the resolver to the
      # trusted workflow commit, and reject dispatches from non-default refs,
      # before any selected release source is checked out or executed.
      - name: Require the trusted default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          test "$WORKFLOW_REF" = "$REPOSITORY/.github/workflows/release.yml@refs/heads/$DEFAULT_BRANCH"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-tools
      - name: Keep the trusted resolver outside the selected source tree
        run: |
          cp trusted-tools/scripts/release_ref.py "$RUNNER_TEMP/release_ref.py"
          rm -rf trusted-tools

      - id: validate
        name: Resolve selected tag and pin its commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          python3 "$RUNNER_TEMP/release_ref.py"
          --tag "$RELEASE_TAG"
          --expected-commit "$EXPECTED_COMMIT"
          --workflow-ref "$WORKFLOW_REF"
          --default-branch "$DEFAULT_BRANCH"
          --repository "$REPOSITORY"

  # Process identity and tree cleanup use Darwin-specific `ps`, process-group,
  # and signal behavior. Keep this native evidence at release time instead of
  # duplicating the complete Linux PR suite on a macOS runner.
  macos-native:
    needs: validate-release-ref
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-tools
      - name: Keep the trusted resolver outside the selected source tree
        run: |
          cp trusted-tools/scripts/release_ref.py "$RUNNER_TEMP/release_ref.py"
          rm -rf trusted-tools
      - name: Recheck tag before target checkout
        env:
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-ref.outputs.tag_object }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          python3 "$RUNNER_TEMP/release_ref.py"
          --tag "$RELEASE_TAG"
          --expected-commit "$EXPECTED_COMMIT"
          --expected-tag-object "$EXPECTED_TAG_OBJECT"
          --workflow-ref "$WORKFLOW_REF"
          --default-branch "$DEFAULT_BRANCH"
          --repository "$REPOSITORY"
          --output /dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit }}
      - name: Verify checked out source SHA
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-go@v7
        with:
          # Go 1.22 test binaries lack the LC_UUID current macOS requires.
          go-version: "1.25.13"
      - name: native authority and process observation tests
        run: go test ./internal/procmon/ ./internal/governance/sessions/ ./internal/mcp/native/

  goreleaser:
    needs: [validate-release-ref, macos-native]
    # Darwin+cgo artifacts need the native Apple SDK. GoReleaser uses cgo only
    # for Darwin targets; Linux and Windows remain CGO_ENABLED=0.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-tools
      - name: Keep the trusted resolver outside the selected source tree
        run: |
          cp trusted-tools/scripts/release_ref.py "$RUNNER_TEMP/release_ref.py"
          rm -rf trusted-tools
      - name: Recheck tag before target checkout
        env:
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-ref.outputs.tag_object }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          python3 "$RUNNER_TEMP/release_ref.py"
          --tag "$RELEASE_TAG"
          --expected-commit "$EXPECTED_COMMIT"
          --expected-tag-object "$EXPECTED_TAG_OBJECT"
          --workflow-ref "$WORKFLOW_REF"
          --default-branch "$DEFAULT_BRANCH"
          --repository "$REPOSITORY"
          --output /dev/null

      # Keep the resolver in RUNNER_TEMP so selected source cannot shadow it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit }}
          fetch-depth: 0

      - name: Verify selected checkout and local tag binding
        env:
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-ref.outputs.tag_object }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$EXPECTED_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"

      - uses: actions/setup-go@v7
        with:
          # Package the released Go binary with the patched toolchain. The
          # Ubuntu compatibility suite separately retains the Go 1.22 floor.
          go-version: "1.26.10"

      # Build the dashboard SPA before tests and goreleaser: goreleaser's builds
      # embed internal/features/dashboard/ui/dist (go:embed all:ui/dist), so the
      # released binaries must be produced from a fresh frontend build, not the
      # legacy fallback. The built index.html is gitignored (only ui/dist/.gitkeep
      # is tracked, and `emptyOutDir: false` keeps it), so the working tree stays
      # clean and goreleaser does not refuse a dirty repo.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/features/dashboard/ui/package-lock.json
      - name: Build frontend
        working-directory: internal/features/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: go test ./...

      - uses: anchore/sbom-action/download-syft@v0
        with:
          # The installer accepts the upstream Git tag, including its `v`
          # prefix. Pin a tag that actually exists so releases fail neither
          # open nor because of an unresolvable tool version.
          syft-version: "v1.51.1"

      - name: Recheck tag immediately before release build and publish
        env:
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-ref.outputs.tag_object }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          python3 "$RUNNER_TEMP/release_ref.py"
          --tag "$RELEASE_TAG"
          --expected-commit "$EXPECTED_COMMIT"
          --expected-tag-object "$EXPECTED_TAG_OBJECT"
          --workflow-ref "$WORKFLOW_REF"
          --default-branch "$DEFAULT_BRANCH"
          --repository "$REPOSITORY"
          --output /dev/null
      - name: Verify local tag still names the validated commit
        env:
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-ref.outputs.tag_object }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$EXPECTED_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Stay within the reviewed major release instead of resolving a
          # moving `latest` tool during a tag transaction (issue #911).
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REF remains the dispatch branch; explicitly bind GoReleaser
          # to the validated tag selected by the maintainer.
          GORELEASER_CURRENT_TAG: ${{ needs.validate-release-ref.outputs.tag }}
