# GoReleaser config for dacli. Triggered only by .github/workflows/release.yml
# on a pushed `v*` tag — tagging is a manual, human step, never automated.
#
# Local dry run (no publish): goreleaser release --snapshot --clean
version: 2

project_name: dacli

before:
  hooks:
    - go mod tidy

builds:
  - id: dacli
    main: ./cmd/dacli
    binary: dacli
    # The Security.framework Keychain adapter is selected only for darwin+cgo.
    # GoReleaser runs on macOS so Clang and the local SDK can build both Darwin
    # architectures; every other target stays pure Go and cross-compilable.
    env:
      - >-
        CGO_ENABLED={{ if eq .Os "darwin" }}1{{ else }}0{{ end }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -buildvcs=true
    ldflags:
      - -s -w -X github.com/mlnomadpy/dacli/internal/buildinfo.Version={{ .Version }}

archives:
  - id: dacli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# An SBOM per archive, so a consumer can answer "what is inside this binary?"
# without trusting a release note. Generated by syft, which goreleaser shells
# out to — the release workflow installs it, and the snapshot job in CI proves
# the whole path produces one on every push rather than discovering it is
# broken at tag time (issue #437 item 10).
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ship:"

# Homebrew is deliberately NOT published here.
#
# A homebrew_casks block used to live at this spot, targeting
# mlnomadpy/homebrew-tap with a HOMEBREW_TAP_GITHUB_TOKEN. Neither exists: the
# tap repo has never been created and the secret has never been set. GoReleaser
# resolves `{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}` at release time, so the very
# first `v*` tag would have created the GitHub release and THEN failed on the
# cask push — a half-published release, which is the worst outcome available.
#
# Restoring it is a three-step manual job, in this order:
#   1. create the mlnomadpy/homebrew-tap repository
#   2. add a HOMEBREW_TAP_GITHUB_TOKEN secret with push access to it
#   3. re-add the homebrew_casks block (see git history for the exact shape)
#
# Do NOT re-add the block before steps 1 and 2, and do not "fix" its absence by
# adding it back with a default-empty token: an empty token does not skip the
# publish, it fails it.

release:
  github:
    owner: dacharika
    name: dacli
  draft: false
  prerelease: auto
